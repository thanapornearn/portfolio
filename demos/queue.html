Btn")+"</button>"+'<button class="confirm" onclick="saveStaffName()">'+T("saveBtn")+"</button>"+"</div>"+"</div>"+"</div>"}function saveStaffName(){const val=document.getElementById("fStaffName").value.trim();if(!val){alert(T("pleaseEnterName"));return}staffName=val;localStorage.setItem("queue_staff_name",val);updateStaffTag();closeModal()}let addPax=2;let isSubmitting=false;function handleAddBtnClick(){if(!staffName){alert(T("pleaseSetStaffNameFirst"));openStaffNameModal();return}openAddModal()}function openAddModal(){addPax=2;const zones=zonesForCurrentBranch();const zoneOptions='<option value="">'+T("noZone2")+"</option>"+zones.map(function(z){return'<option value="'+z.code+'">'+z.code+" — "+zoneLabelText(z.label)+"</option>"}).join("");document.getElementById("modalRoot").innerHTML='<div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">'+'<div class="modal">'+"<h2>＋ "+T("addQueueTitle")+"</h2>"+'<div class="field"><label>'+T("customerNameLabel")+'</label><input id="fName" type="text" placeholder="'+T("customerNamePlaceholder")+'"></div>'+'<div class="field"><label>'+T("phoneLabel")+'</label><input id="fPhone" type="tel" placeholder="08xxxxxxxx"></div>'+'<div class="field"><label>'+T("paxLabel")+"</label>"+'<div class="pax-stepper">'+'<button onclick="stepPax(-1)">－</button>'+'<div class="pax-val" id="paxVal">'+addPax+"</div>"+'<button onclick="stepPax(1)">＋</button>'+'<div class="pax-quick">'+'<button type="button" data-pax="4" onclick="setPax(4)">4</button>'+'<button type="button" data-pax="6" onclick="setPax(6)">6</button>'+'<button type="button" data-pax="10" onclick="setPax(10)">10</button>'+"</div>"+"</div>"+"</div>"+'<div class="field"><label>Zone</label>'+'<select id="fZone">'+zoneOptions+"</select>"+'<label style="display:flex;align-items:center;gap:8px;margin-top:9px;font-weight:500;font-size:13.5px;cursor:pointer;color:#6b6459;">'+'<input type="checkbox" id="fFlexToggle" onchange="toggleFlexZone()" style="width:18px;height:18px;"> '+T("flexZoneLabel")+"</label>"+'<div id="fFlexZones" class="hidden" style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">'+zones.map(function(z){return'<label class="flex-zone-cb-label">'+'<input type="checkbox" class="flex-zone-cb" value="'+z.code+'">'+"<span>"+z.code+" — "+zoneLabelText(z.label)+"</span>"+"</label>"}).join("")+"</div>"+"</div>"+'<div class="field"><label>'+T("noteLabel")+'</label><textarea id="fNote" rows="2"></textarea></div>'+'<div class="modal-actions">'+'<button class="cancel" onclick="closeModal()">'+T("cancelBtn")+"</button>"+'<button class="confirm" onclick="submitAddQueue()">＋ '+T("addQueueBtn")+"</button>"+"</div>"+"</div>"+"</div>";updatePaxDisplay()}function updatePaxDisplay(){const el=document.getElementById("paxVal");if(el)el.textContent=addPax;document.querySelectorAll(".pax-quick button").forEach(function(btn){btn.classList.toggle("active",Number(btn.dataset.pax)===addPax)})}function stepPax(delta){addPax=Math.max(1,addPax+delta);updatePaxDisplay()}function setPax(n){addPax=n;updatePaxDisplay()}function toggleFlexZone(){const isFlex=document.getElementById("fFlexToggle").checked;document.getElementById("fZone").classList.toggle("hidden",isFlex);document.getElementById("fFlexZones").classList.toggle("hidden",!isFlex)}async function submitAddQueue(){if(isSubmitting)return;if(!staffName){alert(T("pleaseSetStaffNameFirst"));openStaffNameModal();return}const name=document.getElementById("fName").value.trim();if(!name){alert(T("pleaseEnterCustomerName"));return}const phone=document.getElementById("fPhone").value.trim();const note=document.getElementById("fNote").value.trim();const isFlex=document.getElementById("fFlexToggle").checked;const payload={action:"addQueue",branch:currentBranch,name:name,phone:phone,pax:addPax,note:note,recordedBy:staffName};if(isFlex){const codes=Array.from(document.querySelectorAll(".flex-zone-cb:checked")).map(function(cb){return cb.value});if(codes.length<2){alert(T("pleaseSelect2Zones"));return}payload.zonePreference=codes}else{payload.zone=document.getElementById("fZone").value}const btn=document.querySelector(".modal-actions .confirm");isSubmitting=true;if(btn){btn.disabled=true;btn.textContent=T("saving");btn.style.opacity="0.6"}try{const res=await apiPost(payload);if(res.success){closeModal();showToast(T("addQueueSuccess1")+res.queueNumber+T("addQueueSuccess2")+(res.zonePreference?T("flexZoneSuffix")+res.zonePreference+")":""));refreshStaff()}else{alert(T("errorOccurred")+res.error);if(btn){btn.disabled=false;btn.textContent="＋ "+T("addQueueBtn");btn.style.opacity="1"}}}catch(err){alert(T("connFailed")+err.message);if(btn){btn.disabled=false;btn.textContent="＋ "+T("addQueueBtn");btn.style.opacity="1"}}finally{isSubmitting=false}}function findQueue(id){return queues.find(function(q){return q.queueId===id})}let editPax=1;function openEditModal(id){const q=findQueue(id);if(!q)return;editPax=Number(q.pax)||1;const zones=zonesForCurrentBranch();const zoneOptions='<option value="">'+T("noZone2")+"</option>"+zones.map(function(z){return'<option value="'+z.code+'"'+(q.zone===z.code?" selected":"")+">"+z.code+" — "+zoneLabelText(z.label)+"</option>"}).join("");document.getElementById("modalRoot").innerHTML='<div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">'+'<div class="modal">'+"<h2>✏️ "+T("editModalTitle")+"</h2>"+'<div class="field"><label>'+T("customerNameLabel")+'</label><input id="eName" type="text" value="'+escapeHtml(q.name)+'"></div>'+'<div class="field"><label>'+T("phoneLabel")+'</label><input id="ePhone" type="tel" value="'+escapeHtml(q.phone||"")+'"></div>'+'<div class="field"><label>'+T("paxLabel")+"</label>"+'<div class="pax-stepper">'+'<button onclick="stepEditPax(-1)">－</button>'+'<div class="pax-val" id="editPaxVal">'+editPax+"</div>"+'<button onclick="stepEditPax(1)">＋</button>'+"</div>"+"</div>"+'<div class="field"><label>Zone</label><select id="eZone">'+zoneOptions+"</select></div>"+'<div class="field"><label>'+T("tableNumberLabel")+'</label><input id="eTableNumber" type="text" value="'+escapeHtml(q.tableNumber||"")+'" placeholder="A28"></div>'+'<div class="field"><label>'+T("noteLabel")+'</label><textarea id="eNote" rows="2">'+escapeHtml(q.note||"")+"</textarea></div>"+'<div class="modal-actions">'+'<button class="cancel" onclick="closeModal()">'+T("cancelBtn")+"</button>"+'<button class="confirm" onclick="submitEditQueue(\''+id+"')\">"+T("saveEditBtn")+"</button>"+"</div>"+"</div>"+"</div>"}function stepEditPax(delta){editPax=Math.max(1,editPax+delta);document.getElementById("editPaxVal").textContent=editPax}async function submitEditQueue(id){if(isSubmitting)return;const name=document.getElementById("eName").value.trim();if(!name){alert(T("pleaseEnterCustomerName"));return}const payload={action:"updateQueue",queueId:id,name:name,phone:document.getElementById("ePhone").value.trim(),pax:editPax,zoneCode:document.getElementById("eZone").value,tableNumber:document.getElementById("eTableNumber").value.trim(),note:document.getElementById("eNote").value.trim()};const btn=document.querySelector(".modal-actions .confirm");isSubmitting=true;if(btn){btn.disabled=true;btn.textContent=T("saving");btn.style.opacity="0.6"}try{const res=await apiPost(payload);if(res.success){closeModal();showToast(T("editSaved"));refreshStaff()}else{alert(T("errorOccurred")+res.error);if(btn){btn.disabled=false;btn.textContent=T("saveEditBtn");btn.style.opacity="1"}}}catch(err){alert(T("connFailed")+err.message);if(btn){btn.disabled=false;btn.textContent=T("saveEditBtn");btn.style.opacity="1"}}finally{isSubmitting=false}}function openCallModal(id){const q=findQueue(id);if(!q)return;document.getElementById("modalRoot").innerHTML='<div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">'+'<div class="modal">'+"<h2>🔔 "+T("callModalTitle")+"</h2>"+'<div class="modal-summary">'+'<div class="big">'+q.queueNumber+"</div>"+'<div class="nm">'+escapeHtml(withKhun(q.name))+"</div>"+'<div class="zn">👥 '+q.pax+" "+T("paxUnit")+(q.zone?" · Zone "+q.zone+" — "+zoneLabelText(q.zoneLabel):"")+"</div>"+"</div>"+'<div class="modal-actions">'+'<button class="cancel" onclick="closeModal()">'+T("cancelBtn")+"</button>"+'<button class="confirm" onclick="doAction(\''+id+"','callQueue')\">"+T("callQueueBtn")+"</button>"+"</div>"+"</div>"+"</div>"}function openSeatModal(id){const q=findQueue(id);if(!q)return;const needsZonePick=!q.zone;let zonePickerHtml="";if(needsZonePick){const options=q.zonePreference?q.zonePreference.split(",").map(function(c){return'<option value="'+c+'">'+c+" — "+zoneLabelForCode(c)+"</option>"}).join(""):zonesForCurrentBranch().map(function(z){return'<option value="'+z.code+'">'+z.code+" — "+zoneLabelText(z.label)+"</option>"}).join("");zonePickerHtml='<div class="field"><label>'+T("seatZoneLabel")+'</label><select id="fSeatZone">'+options+"</select></div>"}document.getElementById("modalRoot").innerHTML='<div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">'+'<div class="modal">'+"<h2>🍽️ "+T("seatModalTitle")+"</h2>"+'<div class="modal-summary">'+'<div class="big">'+q.queueNumber+"</div>"+'<div class="nm">'+escapeHtml(withKhun(q.name))+"</div>"+'<div class="zn">'+T("seatConfirmQuestion")+"</div>"+"</div>"+zonePickerHtml+'<div class="field"><label>'+T("tableNumberOptionalLabel")+'</label><input id="fTableNumber" type="text" placeholder="A28"></div>'+'<div class="modal-actions">'+'<button class="cancel" onclick="closeModal()">'+T("cancelBtn")+"</button>"+'<button class="confirm" onclick="doSeatAction(\''+id+"')\">"+T("seated")+"</button>"+"</div>"+"</div>"+"</div>"}async function doSeatAction(id){const zoneSel=document.getElementById("fSeatZone");if(zoneSel&&!zoneSel.value){alert(T("pleaseSelectSeatZone"));return}const tableInput=document.getElementById("fTableNumber");const extra={};if(zoneSel)extra.zone=zoneSel.value;if(tableInput&&tableInput.value.trim())extra.tableNumber=tableInput.value.trim();await doAction(id,"seatQueue",extra)}function openSimpleConfirm(id,action,message){document.getElementById("modalRoot").innerHTML='<div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">'+'<div class="modal">'+'<div class="modal-summary"><div class="nm">'+message+"</div></div>"+'<div class="modal-actions">'+'<button class="cancel" onclick="closeModal()">'+T("cancelBtn")+"</button>"+'<button class="confirm" onclick="doAction(\''+id+"','"+action+"')\">"+T("confirmBtn")+"</button>"+"</div>"+"</div>"+"</div>"}async function doAction(id,action,extra){if(isSubmitting)return;const btn=document.querySelector(".modal-actions .confirm");isSubmitting=true;if(btn){btn.disabled=true;btn.style.opacity="0.6"}try{const res=await apiPost(Object.assign({action:action,queueId:id},extra||{}));closeModal();if(res.success){showToast((res.queueNumber||"")+" "+T("statusUpdated"));refreshStaff()}else{alert(T("errorOccurred")+res.error)}}catch(err){alert(T("connFailed")+err.message)}finally{isSubmitting=false}}function closeModal(){document.getElementById("modalRoot").innerHTML=""}function closeModalOnBackdrop(e){if(e.target.classList.contains("modal-backdrop"))closeModal()}function showToast(msg){const root=document.getElementById("toastRoot");root.innerHTML='<div class="toast">'+msg+"</div>";setTimeout(function(){root.innerHTML=""},2500)}function getCallingCols(count){if(count===1||count===2||count===4)return 2;if(count===3||count===5||count===6)return 3;if(count>=7)return 4;return 2}async function refreshCustomer(){const res=await apiGet("getQueues",{branch:currentBranch,zone:"ALL",status:"WAITING,CALLED"});if(!res.success)return;const called=res.queues.filter(function(q){return q.status==="CALLED"});const waiting=res.queues.filter(function(q){return q.status==="WAITING"});const callingZone=document.getElementById("callingZone");callingZone.style.gridTemplateColumns=called.length?"repeat("+getCallingCols(called.length)+", 1fr)":"";callingZone.innerHTML=called.length?called.map(function(q){return'<div class="ticket calling-card">'+'<div class="name">'+escapeHtml(withKhun(q.name))+"</div>"+'<div class="qnum">'+q.queueNumber+" - "+q.pax+" "+T("personsUnit")+"</div>"+'<div class="status">'+T("nowCallingBadge")+"</div>"+"</div>"}).join(""):'<div class="calling-empty">'+T("noCallingNow")+"</div>";const waitingList=document.getElementById("waitingList");waitingList.innerHTML=waiting.map(function(q){return'<div class="wrow"><span class="wnum">🎫 '+q.queueNumber+'</span><span class="wname">'+escapeHtml(withKhun(q.name))+" "+q.pax+" "+T("personsUnit")+" — "+T("waitingBadge")+"</span></div>"}).join("")||'<div style="color:var(--slate);text-align:center;width:100%;">'+T("noWaitingNow")+"</div>"}let bookingTables=[];let editingTables=new Set;function timeStrToMinutes(t){const m=String(t||"").match(/(\d{1,2}):(\d{2})/);if(!m)return 9999;return parseInt(m[1],10)*60+parseInt(m[2],10)}async function refreshTables(){const container=document.getElementById("tablesContainer");container.innerHTML='<div class="empty-state">'+T("loading")+"</div>";try{const res=await apiGet("getBookingTables",{branch:currentBranch});if(!res.success){container.innerHTML='<div class="empty-state">'+T("loadFailed")+escapeHtml(res.error)+"</div>";return}bookingTables=(res.tables||[]).slice().sort(function(a,b){return timeStrToMinutes(a.time)-timeStrToMinutes(b.time)});renderTables()}catch(err){container.innerHTML='<div class="empty-state">'+T("connFailed")+escapeHtml(err.message)+"</div>"}}function renderTables(){const container=document.getElementById("tablesContainer");if(!bookingTables.length){container.innerHTML='<div class="empty-state">'+T("noTablesToday")+"</div>";return}const zones=zonesForCurrentBranch();const grouped={};const unclassified=[];bookingTables.forEach(t=>{const code=(t.zone||"").trim().toUpperCase();const known=zones.find(z=>z.code===code);if(known){if(!grouped[code])grouped[code]=[];grouped[code].push(t)}else{unclassified.push(t)}});let html="";zones.forEach(z=>{const items=grouped[z.code];if(!items||!items.length)return;html+=`<div class="section-title">Zone ${escapeHtml(z.code)} — ${escapeHtml(zoneLabelText(z.label))} (${items.length})</div>`;html+='<div class="tables-list">'+items.map(renderTableCard).join("")+"</div>"});if(unclassified.length){html+=`<div class="section-title">${T("unclassifiedZone")} (${unclassified.length})</div>`;html+='<div class="tables-list">'+unclassified.map(renderTableCard).join("")+"</div>"}container.innerHTML=html}function renderTableCard(t){const isCancelled=t.bookingStatus==="ยกเลิก"||t.bookingStatus==="Cancelled";const zoneChip=t.zone?'<span class="tt-zone">Zone '+escapeHtml(t.zone)+"</span>":"";const isEditing=editingTables.has(t.bookingKey)||!t.tableNumber;let tableControlHtml="";if(!isCancelled){if(isEditing){tableControlHtml='<div class="tt-input-row">'+'<input type="text" id="tbl_'+escapeHtml(t.bookingKey)+'" placeholder="'+T("tableNumberPlaceholder")+'" value="'+escapeHtml(t.tableNumber||"")+'">'+"<button onclick=\"saveTableNumber('"+escapeHtml(t.bookingKey)+"')\">"+T("saveBtn")+"</button>"+"</div>"}else{tableControlHtml='<div class="tt-input-row">'+'<span class="tt-table-display">🍽️ '+T("tablePrefix")+escapeHtml(t.tableNumber)+"</span>"+'<button class="icon-btn" aria-label="'+T("edit")+'" onclick="editTableNumber(\''+escapeHtml(t.bookingKey)+"')\">✏️</button>"+"</div>"}}return'<div class="ticket table-card'+(isCancelled?" cancelled":"")+'">'+'<div class="table-card-top">'+'<span class="tt-time">'+escapeHtml(t.time||"-")+"</span>"+'<span class="table-card-name">'+escapeHtml(withKhun(t.name))+"</span>"+zoneChip+"</div>"+'<div class="table-card-bottom">'+'<span class="tt-meta">👥 '+escapeHtml(String(t.pax||"-"))+" "+T("paxUnit")+(isCancelled?" · "+T("cancelledSuffix"):"")+"</span>"+tableControlHtml+"</div>"+"</div>"}function editTableNumber(bookingKey){editingTables.add(bookingKey);renderTables()}async function saveTableNumber(bookingKey){const input=document.getElementById("tbl_"+bookingKey);if(!input)return;const tableNumber=input.value.trim();try{const res=await apiPost({action:"setBookingTableNumber",bookingKey:bookingKey,tableNumber:tableNumber});if(res.success){const found=bookingTables.find(function(t){return t.bookingKey===bookingKey});if(found)found.tableNumber=tableNumber;editingTables.delete(bookingKey);showToast(T("tableSaved"));renderTables()}else{alert(T("tableSaveFailed")+res.error)}}catch(err){alert(T("connFailed")+err.message)}}init()</script> </body> </html>
